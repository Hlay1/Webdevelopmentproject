<html>
    <head>
        <title>Idea Builder</title>
        <style>
            body {
                margin: 0;
                font-family: "Plus Jakarta Sans", Arial, sans-serif;
                background: #e8eef4;
                color: #111;
            }

            nav {
                text-align: left;
                width: 100%;
                padding: 1rem 2rem 0;
                border-bottom: 6px solid #6f42c1;
                box-sizing: border-box;
            }

            nav ul {
                display: flex;
                justify-content: flex-start;
                align-items: center;
                gap: 1.5rem;
                list-style: none;
                margin: 0;
                padding: 0 0 1rem;
                flex-wrap: wrap;
            }

            nav li {
                display: inline-block;
            }

            nav a {
                color: #111;
                text-decoration: none;
                border: 3px solid #6f42c1;
                border-radius: 10px;
                padding: 0.5rem 0.9rem;
                display: inline-block;
                background: #e0edf1;
                font-weight: 600;
            }

            .builder-shell {
                max-width: 900px;
                margin: 40px auto;
                padding: 24px;
            }

            h1 {
                margin-bottom: 12px;
                text-align: center;
            }

            .intro-text {
                margin: 0 0 20px;
                text-align: center;
                font-size: 1.1rem;
                color: #4c1d95;
                line-height: 1.5;
            }

            .stage-flow {
                display: flex;
                justify-content: center;
                margin-top: 24px;
            }

            .stage-card {
                width: 100%;
                max-width: 760px;
                padding: 24px;
                background: #ffffff;
                border: 4px solid #8b5cf6;
                border-radius: 18px;
                box-shadow: 0 8px 24px rgba(107, 70, 193, 0.12);
            }

            .stage-header {
                font-size: 1.4rem;
                font-weight: 700;
                margin-bottom: 18px;
                color: #4c1d95;
            }

            .option-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 12px;
            }

            .option {
                padding: 16px 12px;
                font-size: 1rem;
                font-weight: 600;
                border: 2px solid #8b5cf6;
                border-radius: 12px;
                background: #f5f3ff;
                color: #3b0764;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .option:hover,
            .option.selected {
                background: #ede9fe;
                transform: translateY(-1px);
                box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
            }

            .idea-box {
                margin-top: 30px;
                padding-top: 20px;
                border-top: 2px solid #ddd6fe;
            }

            label {
                display: block;
                font-weight: 700;
                margin-bottom: 10px;
            }

            textarea,
            input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                padding: 12px;
                border: 2px solid #c4b5fd;
                border-radius: 10px;
                resize: vertical;
                font: inherit;
            }

            .generate-button {
                margin-top: 16px;
                padding: 12px 20px;
                background: #8b5cf6;
                color: white;
                border: none;
                border-radius: 10px;
                font-weight: 700;
                cursor: pointer;
            }

            .ideas-panel {
                width: 100%;
                max-width: 760px;
                margin: 32px auto 0;
                padding: 24px;
                background: #ffffff;
                border: 4px solid #8b5cf6;
                border-radius: 18px;
                box-sizing: border-box;
                box-shadow: 0 8px 24px rgba(107, 70, 193, 0.12);
            }

            .ideas-panel h2 {
                margin: 0 0 12px;
                color: #4c1d95;
            }

            .ideas-panel a {
                color: #4c1d95;
                font-weight: 700;
            }

            .idea-result-list {
                margin: 16px 0 0;
                padding-left: 20px;
                line-height: 1.8;
                color: #111;
            }

            .hidden {
                display: none;
            }
        </style>
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="Projects-scratch.html">Projects</a></li>
                <li><a href="Builder.html">Builder</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="builder-shell">
            <h1>Idea Builder</h1>
            <p class="intro-text">Use the options below to generate some ideas for your next project!</p>
            <div class="stage-flow">
                <div class="stage-card">
                    <div class="stage-header">Stage 1: Budget</div>
                    <div class="option-grid">
                        <button type="button" class="option" data-budget="$1">$1</button>
                        <button type="button" class="option" data-budget="$10">$10</button>
                        <button type="button" class="option" data-budget="$100">$100</button>
                        <button type="button" class="option" data-budget="More?">More?</button>
                        <button type="button" class="option" data-budget="Less????">Less????</button>
                    </div>
                </div>
            </div>

            <div class="stage-flow">
                <div class="stage-card">
                    <div class="stage-header">Stage 2: Structure</div>
                    <div class="option-grid">
                        <button type="button" class="option structure-option" data-structure="Wood">Wood</button>
                        <button type="button" class="option structure-option" data-structure="Steel">Steel</button>
                        <button type="button" class="option structure-option" data-structure="Ceramic">Ceramic</button>
                        <button type="button" class="option structure-option" data-structure="Vibraium">Vibraium</button>
                        <button type="button" class="option structure-option" data-structure="Brick">Brick</button>
                        <button type="button" class="option structure-option" data-structure="Culinary supplies">Culinary supplies</button>
                        <button type="button" class="option structure-option" data-structure="Other">Other</button>
                    </div>

                    <div id="other-structure-wrapper" class="hidden" style="margin-top: 16px;">
                        <label for="other-structure">Please specify</label>
                        <input id="other-structure" type="text" placeholder="Please specify" />
                    </div>
                </div>
            </div>

            <div class="stage-flow">
                <div class="stage-card">
                    <div class="stage-header">Stage 3: Scope</div>
                    <div class="option-grid">
                        <button type="button" class="option scope-option" data-scope="Small">Small</button>
                        <button type="button" class="option scope-option" data-scope="Medium">Medium</button>
                        <button type="button" class="option scope-option" data-scope="Large">Large</button>
                    </div>
                </div>
            </div>

            <div class="idea-box">
                <div id="status-text" class="status-text" aria-live="polite" style="margin-top: 12px; display: none; font-weight: 700; color: #4c1d95;"></div>
            </div>

            <div class="ideas-panel">
                <h2>Matching Ideas</h2>
                <p>Reference list: <a href="Possible%20ideas" target="_blank" rel="noopener">Possible ideas</a></p>
                <ul id="idea-results" class="idea-result-list"></ul>
            </div>
        </div>

        <script>
            let selectedBudget = "";
            let selectedStructure = "";
            let selectedScope = "";

            const statusText = document.getElementById('status-text');
            const ideaResults = document.getElementById('idea-results');

            const ideaDatabase = {
                "$1": {
                    Wood: { Small: ["Toothpick model bridge", "Mini wooden bookmark (scrap wood)", "Popsicle-stick phone stand", "Scrap-wood keychain", "Tiny wooden puzzle piece"], Medium: ["Small shelf from discarded pallet wood", "Rustic picture frame", "Simple bird perch", "Scrap-wood desk organizer", "Mini planter box"], Large: ["Pallet-wood outdoor bench", "Garden compost bin", "Rustic wall paneling", "Wooden crate storage system", "DIY pallet coffee table"] },
                    Steel: { Small: ["Paperclip sculpture", "Tin-can candle holder", "Small wire hook", "Binder-clip phone stand", "Steel washer keychain"], Medium: ["Tin-can lantern", "Wire photo display", "Scrap-metal wind chime", "Simple metal bracket shelf", "Steel-washer coaster set"], Large: ["Scrap-metal garden trellis", "Rebar art sculpture", "Tin-can rocket stove", "Sheet-metal reflector oven", "Steel-pipe clothes rack (found pipes)"] },
                    Ceramic: { Small: ["Broken-tile mosaic coaster", "Ceramic shard jewelry", "Mini planter from a broken mug", "Mosaic fridge magnet", "Ceramic shard keychain"], Medium: ["Mosaic stepping stone", "Tile-top side table (scrap tile)", "Ceramic wall art", "Mosaic serving tray", "Broken-pot fairy garden"], Large: ["Mosaic patio tabletop", "Ceramic garden path", "Large mosaic mural", "Repaired pottery display", "Ceramic-tile fire pit surround"] },
                    Vibraium: { Small: ["Mini 'energy core' prop", "Vibranium-themed keychain", "Tiny shield replica", "Sci-fi badge", "Micro-prop for cosplay"], Medium: ["Vibranium gauntlet prop", "Sci-fi wall panel", "Futuristic mask", "Energy-reactor desk ornament", "Vibranium-style dagger prop"], Large: ["Full cosplay shield", "Sci-fi armor chest piece", "Vibranium reactor display", "Futuristic door panel", "Full helmet build"] },
                    Brick: { Small: ["Mini brick paperweight", "Brick pencil holder", "Brick bookend", "Brick planter", "Brick candle stand"], Medium: ["Brick BBQ starter chimney", "Brick garden border", "Brick fire-safe box", "Brick tool stand", "Brick outdoor stool"], Large: ["Brick oven base", "Brick fire pit", "Brick retaining wall", "Brick grill station", "Brick patio square"] },
                    "Culinary supplies": { Small: ["Sugar-cube sculpture", "Pasta-stick model tower", "Salt-dough ornament", "Spice-jar candle holder", "Cookie-cutter clay mold"], Medium: ["Salt-dough bowl", "Pasta-art wall piece", "DIY spice rack (reused jars)", "Bread-dough sculpture", "Culinary-themed centerpiece"], Large: ["Gingerbread architectural model", "Large salt-dough statue", "Pasta-art mural", "Culinary-material sculpture", "Food-based event display"] },
                    Other: { Small: ["Paper origami", "Rubber-band powered car", "Bottle-cap art", "Cardboard phone stand", "Mini duct-tape wallet"], Medium: ["Cardboard VR viewer", "Plastic-bottle planter", "Rope wall hanging", "DIY kite", "Simple LED throwie"], Large: ["Cardboard furniture", "PVC pipe greenhouse frame", "Large rope hammock", "DIY tarp shelter", "Recycled-material sculpture"] }
                },
                "$10": {
                    Wood: { Small: ["Carved spoon", "Wooden dice", "Mini jewelry box", "Small picture frame", "Wooden puzzle"], Medium: ["Cutting board", "Wall shelf", "Birdhouse", "Tool caddy", "Coat rack"], Large: ["Coffee table", "Garden bench", "Bookshelf", "Raised planter", "Shoe rack"] },
                    Steel: { Small: ["Steel-washer fidget toy", "Wire sculpture", "Tin-can stove", "Small bracket set", "Metal key organizer"], Medium: ["Metal wall art", "Wire basket", "Steel-pipe lamp base", "Sheet-metal toolbox", "Rebar garden stake"], Large: ["Steel-pipe shelving", "Metal fire pit", "Welded sculpture", "Steel-frame table", "Metal garden arch"] },
                    Ceramic: { Small: ["Painted tile coaster", "Mini ceramic planter", "Mosaic trivet", "Tile magnet set", "Ceramic pendant"], Medium: ["Mosaic mirror frame", "Tile backsplash panel", "Ceramic wall mosaic", "Tile-top table", "Ceramic planter pot"], Large: ["Mosaic patio table", "Ceramic fountain base", "Large tile mural", "Ceramic garden path", "Tile fire-pit surround"] },
                    Vibraium: { Small: ["Mini shield", "Energy-core prop", "Vibranium coin", "Sci-fi badge", "Tiny armor plate"], Medium: ["Arm bracer", "Helmet front plate", "Reactor prop", "Vibranium dagger", "Sci-fi shoulder armor"], Large: ["Full shield", "Chest armor", "Helmet", "Reactor display", "Full cosplay suit"] },
                    Brick: { Small: ["Brick candle holder", "Brick bookend", "Brick planter", "Brick incense stand", "Brick paperweight"], Medium: ["Brick grill starter", "Brick garden border", "Brick tool stand", "Brick stool", "Brick mailbox base"], Large: ["Brick oven", "Brick fire pit", "Brick patio", "Brick retaining wall", "Brick grill station"] },
                    "Culinary supplies": { Small: ["Salt-dough ornaments", "Sugar-cube sculptures", "Pasta-art models", "Spice-jar crafts", "Cookie-cutter clay shapes"], Medium: ["Salt-dough bowls", "Pasta-art wall decor", "Culinary centerpiece", "Bread-dough sculpture", "Jar-based lanterns"], Large: ["Gingerbread structures", "Large salt-dough statue", "Pasta mural", "Culinary sculpture", "Food-art display"] },
                    Other: { Small: ["Duct-tape wallet", "Origami set", "Bottle-cap art", "Cardboard organizer", "Rope keychain"], Medium: ["PVC frame", "Cardboard VR viewer", "Rope wall hanging", "Plastic-bottle lamp", "DIY kite"], Large: ["PVC greenhouse", "Cardboard furniture", "Rope hammock", "Tarp shelter", "Recycled sculpture"] }
                },
                "$100": {
                    Wood: { Small: ["Hardwood pen", "Carved figurine", "Premium picture frame", "Jewelry box", "Wooden phone amplifier"], Medium: ["Hardwood cutting board", "Floating shelf", "Wooden stool", "Wall mounted desk organizer", "Wooden lamp base"], Large: ["Custom hardwood bench", "Bookshelf unit", "Dining table accent", "Plantation-style chair set", "Large storage cabinet"] },
                    Steel: { Small: ["Precision metal bookmark", "Steel pendant", "Custom bracket set", "Metal dice set", "Mini metal tray"], Medium: ["Steel wall sculpture", "Metal planter stand", "Custom tool rack", "Metal side table", "Steel-backed shelf"], Large: ["Steel frame bench", "Large metal table", "Garden trellis wall", "Industrial rack system", "Custom metal bench"] },
                    Ceramic: { Small: ["Decorative ceramic tile set", "Mini ceramic vase", "Mosaic trivet", "Handmade mug set", "Ceramic earrings"], Medium: ["Large ceramic planter", "Tile-top stool", "Decorative wall panel", "Ceramic sink stand", "Mosaic chair side table"], Large: ["Ceramic tiled bench", "Large mosaic table", "Outdoor ceramic planter wall", "Custom ceramic garden path", "Large tile art wall"] },
                    Vibraium: { Small: ["Prototype energy token", "Mini display shield", "Tech badge", "Collector coin", "Sci-fi keyfob"], Medium: ["Advanced gauntlet unit", "Display reactor", "Helmet shell", "Energy blade stand", "Custom sci-fi rack"], Large: ["Full armor display", "Reactor wall display", "Cosplay chestpiece", "Heroic shield panel", "Large sci-fi installation"] },
                    Brick: { Small: ["Brick ornament set", "Brick bookend pair", "Mini brick planter", "Brick candle jars", "Brick desk tray"], Medium: ["Brick table base", "Brick compost bin", "Brick rolling cart", "Brick pub stool", "Brick fireplace surround"], Large: ["Brick pizza oven", "Brick patio set", "Brick storage wall", "Brick outdoor oven", "Brick garden retreat"] },
                    "Culinary supplies": { Small: ["Decorative sugar set", "Mini spice display", "Pasta sculpture set", "Cookie cutter art", "Clay food prop set"], Medium: ["Large culinary centerpiece", "Pasta-art partition", "Spice organizer wall", "Bread-form stool", "Tabletop food display"], Large: ["Giant gingerbread structure", "Large food-art installation", "Culinary mural wall", "Pasta architecture display", "Festival food tableau"] },
                    Other: { Small: ["Origami set box", "Plastic art panel", "Rope key organizer", "Bottle-cap display", "Cardboard organizer kit"], Medium: ["Mixed-material chair", "PVC art frame", "Tarp shade panel", "Cardboard display wall", "Rope wall sculpture"], Large: ["Large recycled installation", "PVC workshop frame", "Tarp structure", "Large cardboard build", "Mixed-material furniture set"] }
                }
            };

            function normalizeStructure(value) {
                if (!value) return "";
                return value.trim();
            }

            function getIdeasForCurrentSelection() {
                if (!selectedBudget || !selectedStructure || !selectedScope) {
                    return [];
                }

                const budgetKey = selectedBudget;
                const structureKey = normalizeStructure(selectedStructure);
                const scopeKey = selectedScope;

                const budgetGroup = ideaDatabase[budgetKey] || ideaDatabase["$1"];
                const structureGroup = budgetGroup[structureKey] || budgetGroup.Wood || {};
                const matches = structureGroup[scopeKey] || [];

                return matches.slice(0, 5);
            }

            function renderIdeas() {
                const ideas = getIdeasForCurrentSelection();
                ideaResults.innerHTML = ideas.map((idea) => `<li>${idea}</li>`).join('');
            }

            function updateStatus(message, isVisible = true) {
                statusText.textContent = message;
                statusText.style.display = isVisible ? 'block' : 'none';
            }

            document.querySelectorAll('.option').forEach((button) => {
                button.addEventListener('click', () => {
                    const isStructureOption = button.classList.contains('structure-option');
                    const isScopeOption = button.classList.contains('scope-option');

                    if (isStructureOption) {
                        document.querySelectorAll('.structure-option').forEach((btn) => btn.classList.remove('selected'));
                        button.classList.add('selected');
                        selectedStructure = button.dataset.structure || button.textContent.trim();

                        const otherWrapper = document.getElementById('other-structure-wrapper');
                        const otherInput = document.getElementById('other-structure');

                        if (selectedStructure === 'Other') {
                            otherWrapper.classList.remove('hidden');
                            otherInput.focus();
                        } else {
                            otherWrapper.classList.add('hidden');
                            otherInput.value = '';
                        }
                        renderIdeas();
                        return;
                    }

                    if (isScopeOption) {
                        document.querySelectorAll('.scope-option').forEach((btn) => btn.classList.remove('selected'));
                        button.classList.add('selected');
                        selectedScope = button.dataset.scope || button.textContent.trim();
                        renderIdeas();
                        return;
                    }

                    document.querySelectorAll('.option').forEach((btn) => {
                        if (!btn.classList.contains('structure-option') && !btn.classList.contains('scope-option')) {
                            btn.classList.remove('selected');
                        }
                    });
                    button.classList.add('selected');
                    selectedBudget = button.dataset.budget || button.textContent.trim();
                    renderIdeas();
                });
            });

            renderIdeas();
        </script>
    </body>
</html>
